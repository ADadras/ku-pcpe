name: CPU fixture
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: ruff check --select E9,F63,F7,F82 src scripts tests website/tools
      - run: ruff format --check src scripts tests website/tools
      - run: python scripts/verify_release.py
      - run: python website/tools/check_site.py
      - run: node --check website/site/app.js
      - run: python -m pytest -q
      - run: python -I scripts/run_smoke_test.py
